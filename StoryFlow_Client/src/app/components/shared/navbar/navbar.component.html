<mat-toolbar id="toolbar-container">
  <div id="desktop-navbar-logo" class="logo"></div>
  <a mat-button [matMenuTriggerFor]="menu" id="mobile-menu-button">
    <mat-icon>menu</mat-icon>
  </a>
  <mat-menu #menu="matMenu">
    <a mat-menu-item routerLink="/">HOME</a>
    <a mat-menu-item routerLink="/login" *ngIf="!(authService.currentUserSource$ | async)">LOGIN</a>
    <a mat-menu-item routerLink="/register" *ngIf="!(authService.currentUserSource$ | async)">REGISTER</a>
    <a mat-menu-item routerLink="/text-selection" *ngIf="(authService.currentUserSource$ | async)">CHOOSE A TEXT</a>
    <a mat-menu-item routerLink="/profile" *ngIf="(authService.currentUserSource$ | async)">PROFILE</a>
  </mat-menu>
  <div id="mobile-navbar-logo" class="logo"></div>
  <div id="desktop-navbar">
    <a mat-button routerLink="/" class="navbar-desktop-button">HOME</a>
    <a mat-button routerLink="/login" class="navbar-desktop-button" *ngIf="!(authService.currentUserSource$ | async)"> LOGIN </a>
    <a mat-button routerLink="/register" class="navbar-desktop-button" *ngIf="!(authService.currentUserSource$ | async)">
      REGISTER
    </a>
    <a mat-button routerLink="/text-selection" class="navbar-desktop-button" *ngIf="(authService.currentUserSource$ | async)">
      CHOOSE A TEXT
    </a>
    <a mat-button routerLink="/profile" class="navbar-desktop-button" *ngIf="(authService.currentUserSource$ | async)">
      PROFILE
    </a>
  </div>
</mat-toolbar>
