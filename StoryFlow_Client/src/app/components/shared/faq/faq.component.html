<div
  id="faq-container"
  class="container"
  [ngClass]="{
    'light-mode-background-primary light-mode-text':
      (themeService.theme$ | async),
    'dark-mode-background-primary dark-mode-text': !(
      themeService.theme$ | async
    ),
  }"
>
  <h1>FAQ - Nauka angielskiego z StoryFlow</h1>

  @for (section of faq; track section.id) {
    <section class="faq-section" [attr.aria-labelledby]="section.id">
      <h2 [id]="section.id">{{ section.title }}</h2>

      @for (item of section.items; track item.question) {
        <div
          class="faq-item"
          [class.faq-item--open]="isOpen(section.id, item.question)"
        >
          <h3 class="faq-item__heading">
            <button
              type="button"
              class="faq-item__trigger"
              [attr.aria-expanded]="isOpen(section.id, item.question)"
              [attr.aria-controls]="section.id + '-' + item.question"
              (click)="toggle(section.id, item.question)"
            >
              <span class="item-question">{{ item.question }}</span>
              <span class="faq-item__icon" aria-hidden="true">+</span>
            </button>
          </h3>

          @if (isOpen(section.id, item.question)) {
            <div
              class="answer-item"
              [ngClass]="{
                'light-mode-border-bottom':
                  (themeService.theme$ | async),
                'dark-mode-border-bottom': !(
                  themeService.theme$ | async
                ),
              }"
              [id]="section.id + '-' + item.question"
              role="region"
            >
              {{ item.answer }}
            </div>
          }
        </div>
      }
    </section>
  }
</div>
