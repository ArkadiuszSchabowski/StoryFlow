<div id="center" *ngIf="story">
  <button class="button-sentence" (click)="changeTitleLanguage(story)">
    {{ story.visibleTitleMeaning }}
  </button>
  <button class="button-sentence" (click)="changeDescriptionLanguage(story)">
    {{ story.visibleDescriptionMeaning }}
  </button>
  <p>
    Category: {{ story.storyCategory }}, Size: {{ story.storySize }}, Level:
    {{ story.languageLevel }}
  </p>

  <div *ngFor="let sentence of story.sentences">
    <button class="button-sentence" (click)="changeSentenceLanguage(sentence)">
      {{ sentence.visibleSentenceMeaning }}
    </button>
  </div>
</div>
