<div
  class="container"
  [ngClass]="{
    'light-mode-background-primary light-mode-text': (themeService.theme$ | async),
    'dark-mode-background-primary dark-mode-text': !(themeService.theme$ | async),
  }"
>
  <h1 class="title">Ups! Ta historia zaginęła!</h1>
  <button
    mat-raised-button
    id="action-button"
    class="button-app-reverse-color button-standard"
    (click)="navigateToHome()"
  >
    Strona główna
  </button>
</div>
