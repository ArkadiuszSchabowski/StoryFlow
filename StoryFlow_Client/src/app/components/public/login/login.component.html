<div id="login-container" class="container">
  <form [formGroup]="form" (ngSubmit)="login()" autocomplete="off">
    <mat-card class="login-card">
      <mat-card-title id="card-title"
        >Ready to continue? Sign in.</mat-card-title
      >
      <mat-card-content>
        <mat-form-field class="card-input">
          <mat-label>E-mail</mat-label>
          <input class="input" matInput name="email" formControlName="email" />
          <mat-error
            *ngIf="
              form.get('email')?.hasError('required') &&
              form.get('email')?.touched
            "
          >
            Email is required.
          </mat-error>

          <mat-error
            *ngIf="
              form.get('email')?.hasError('email') && form.get('email')?.touched
            "
          >
            Please enter a valid email address.
          </mat-error>
        </mat-form-field>
        <mat-form-field class="card-input">
          <mat-label>Password</mat-label>
          <input
            class="input"
            matInput
            [type]="hidePassword() ? 'password' : 'text'"
            name="password"
            formControlName="password"
          />
          <button
            type="button"
            class="password-button"
            mat-icon-button
            matSuffix
            (click)="changePasswordVisibility($event)"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hidePassword()"
          >
            <mat-icon>{{
              hidePassword() ? "visibility_off" : "visibility"
            }}</mat-icon>
          </button>
          <mat-error
            *ngIf="
              form.get('password')?.hasError('required') &&
              form.get('password')?.touched
            "
          >
            Password is required.
          </mat-error>
        </mat-form-field>
        <div id="submit-button-container">
          <button
            mat-raised-button
            id="submit-button"
            color="accent"
            type="submit"
          >
            Login
          </button>
        </div>
      </mat-card-content>
    </mat-card>
  </form>
</div>
