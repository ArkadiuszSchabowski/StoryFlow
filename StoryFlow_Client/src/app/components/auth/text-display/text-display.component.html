<div id="text-display-container" *ngIf="story">
  <div id="story-information">
    Category: {{showCategory(story.storyCategory)}}, Size: {{showSize(story.storySize)}}, Level:
    {{ showLanguageLevel(story.languageLevel) }}
  </div>

  <div id="title-container">
    <div>
      <button
        mat-raised-button
        color="accent"
        class="action-button"
        (click)="changeTitleLanguage(story)"
      >
        <div><mat-icon>repeat</mat-icon></div>
      </button>
    </div>
    <h2>{{ story.visibleTitleMeaning }}</h2>
  </div>

  <div id="description-container">
    <div>
      <button
        mat-raised-button
        color="accent"
        class="action-button"
        (click)="changeDescriptionLanguage(story)"
      >
        <div><mat-icon>repeat</mat-icon></div>
      </button>
    </div>
    <h3>{{ story.visibleDescriptionMeaning }}</h3>
  </div>

  <div id="sentence-container">
    <div class="sentence-item" *ngFor="let sentence of story.sentences">
      <div>
        <button
          mat-raised-button
          color="accent"
          class="action-button"
          (click)="changeSentenceLanguage(sentence)"
        >
          <div><mat-icon>repeat</mat-icon></div>
        </button>
      </div>
      <div>{{ sentence.visibleSentenceMeaning }}</div>
    </div>
  </div>
  <div class="submit-button-container">
    <button
      mat-raised-button
      class="submit-button"
      id="submit-button"
      type="submit"
      (click)="gotoQuiz()"
    >
      QUIZ
    </button>

</div>
