<div id="quiz-container" class="container" *ngIf="quiz">
  <div class="title">Quiz - {{ story?.englishTitle }}</div>

  <form (ngSubmit)="submitQuiz()">
    <div
      class="question-card"
      *ngFor="let question of quiz.questions; let i = index"
    >
      <h3 class="question-text">{{ i + 1 }}. {{ question.questionText }}</h3>

      <div class="answer" *ngFor="let answer of question.answers">
        <label>
          <input
            type="radio"
            [name]="'question-' + question.id"
            [value]="answer.id"
            [(ngModel)]="selectedAnswers[question.id]"
          />

          <span> {{ answer.key }}. {{ answer.text }} </span>
        </label>
      </div>
    </div>

    <div class="submit-button-container">
      <button
        mat-raised-button
        class="submit-button"
        id="submit-button"
        type="submit"
      >
        SEND ANSWERS
      </button>
    </div>
  </form>
</div>
